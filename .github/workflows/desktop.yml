# Builds the Lyrichord desktop installers on real Windows and Mac machines and attaches them to a GitHub Release.
# Run it from the Actions tab ("Run workflow"), or push a tag like v2026.11.21-r11.
# Each build installs every library and model, then starts the bundled app and analyses tests/demo.wav before packaging.
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build which installers"
        type: choice
        options: [all, windows, mac]
        default: all
      edition:
        description: "Which app: full (Lyrichord) or free (Lyrichord Free)"
        type: choice
        options: [full, free]
        default: free
  push:
    # v<version> = Lyrichord, free-v<version> = Lyrichord Free
    tags: ["v*", "free-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (M1 and newer)
        include: ${{ fromJSON(inputs.only == 'windows' && '[{"os":"windows-latest","name":"windows"}]' || inputs.only == 'mac' && '[{"os":"macos-latest","name":"mac-arm64"}]' || '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"mac-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PIP_NO_CACHE_DIR: "1"
      PYTHONUTF8: "1"
      EDITION: ${{ startsWith(github.ref, 'refs/tags/v') && 'full' || inputs.edition || 'free' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bundle, self-test, package
        shell: bash
        run: python desktop/build.py --out dist/desktop --test --package --edition "$EDITION"

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Get-Content backend/VERSION).Trim()
          $slug = if ($env:EDITION -eq "free") { "LyrichordFree" } else { "Lyrichord" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DEdition=$env:EDITION" "/DSrcDir=$PWD\dist\desktop\$slug" "/DOutDir=$PWD\dist\desktop" desktop\windows\lyricord.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist/desktop/*.exe | Format-Table Name, Length

      - name: Attach to the release
        shell: bash
        run: |
          V=$(tr -d '\r\n' < backend/VERSION); TAG="v$V"
          if [ "$EDITION" = free ]; then
            TAG="free-v$V"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Lyrichord Free $V" --notes-file docs/INSTALL-free.md || true
          fi
          shopt -s nullglob; F=$(echo dist/desktop/*.exe dist/desktop/*.dmg)
          [ -n "$F" ] || { echo "no installer built"; exit 1; }
          ls -la $F
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Lyrichord $V" \
            --notes "Windows: run Lyrichord-Setup-$V.exe (SmartScreen: More info → Run anyway). Mac (Apple Silicon): open the .dmg, drag Lyrichord to Applications, open it once, then System Settings → Privacy & Security → Open Anyway." || true
          sleep 5
          gh release upload "$TAG" $F --clobber
          # checksums, so anyone can check the download is the one built here
          if command -v sha256sum >/dev/null; then H="sha256sum"; else H="shasum -a 256"; fi
          (cd dist/desktop && for f in $F; do $H "$(basename "$f")"; done) > "dist/desktop/SHA256-${{ matrix.name }}.txt"
          cat "dist/desktop/SHA256-${{ matrix.name }}.txt"
          gh release upload "$TAG" "dist/desktop/SHA256-${{ matrix.name }}.txt" --clobber
